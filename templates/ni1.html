<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>HBD</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script&display=swap" rel="stylesheet">
<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #0b1d2a 0%, #132f4c 50%, #1c3f63 100%);
    color: #f5ebdd;
    font-family: 'Dancing Script', cursive;
}

.container {
    text-align: center;
    max-width: 600px;
}

h1 {
    color: #e6b66a;
    text-shadow: 0 0 10px rgba(230, 182, 106, 0.3);
    font-family: 'Great Vibes', cursive;
    font-size: 60px;
    margin-bottom: 20px;
}

p {
    font-size: 18px;
    max-width: 600px;
    text-align: center;
    line-height: 1.6;
    font-family: 'Dancing Script
    ', cursive;
}

.signature {
    margin-top: 40px;
    font-size: 16px;
    opacity: 0.7;
}
</style>
</head>
<body>
<div class="container">
    <h1>Happy Birthday</h1>
    <p>
        Today is such a special day!<br>
        I'm so grateful to have you in my life.<br>
        Wishing you all the happiness and joy on your birthday and always!<br>
        May your day be filled with love, laughter,<br>
        and unforgettable moments.<br>
    </p>
    <div class="signature">
        — Joe.
    </div>
</div>
</body>
</html>
