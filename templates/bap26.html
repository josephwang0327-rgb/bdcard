<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>HBD</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script&display=swap" rel="stylesheet">
<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #8dcdfb 0%, #1f5082 100%);
    color: #f5ebdd;
    font-family: 'Dancing Script', cursive;
}

.container {
    text-align: center;
    max-width: 600px;
}

h1 {
    color: #fbc142;
    text-shadow: 0 0 10px rgb(240, 138, 50);
    font-family: 'Palatino', serif;
    font-size: 40px;
    margin-bottom: 20px;
    font-style: italic;
}

p {
    font-size: 18px;
    max-width: 600px;
    text-align: center;
    line-height: 1.6;
    font-family: 'Dancing Script', cursive;
    color: #000000;
}

.signature {
    margin-top: 40px;
    font-size: 16px;
    opacity: 0.7;
}
</style>
</head>
<body>
<div class="container">
    <h1>Happy Baptism</h1>
    <p>
        This is the day which you become a christian a few years ago.</br>
        This also the day we become siblings in Christ.</br>
        Remember, you're always enough in God's eyes.</br>
        Put your trust in Him and He will pick you up wherever you are.</br> 
    </p>
    <div class="signature">
        — Joe.
    </div>
</div>
</body>
</html>
